plugins {
    id 'java'
}

description '安全权限'

dependencies {

// https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-security
    api ('org.springframework.security:spring-security-core'){
        transitive(true)
    }

    api ('org.springframework.security:spring-security-config'){
        transitive(true)
    }

    api ('org.springframework.security:spring-security-rsa'){
        transitive(true)
    }

    api ('org.springframework.security:spring-security-crypto'){
        transitive(true)
    }

    // https://mvnrepository.com/artifact/com.azure/azure-identity
//    api("com.azure:azure-identity:${identityVersion}"){
//        transitive(true)
//    }

//    // https://mvnrepository.com/artifact/com.microsoft.azure/msal4j
//    api("com.microsoft.azure:msal4j:${msal4jVersion}") {
//        transitive(true)
//    }
//
//// https://mvnrepository.com/artifact/org.springframework.security/spring-security-oauth2-authorization-server
//    api("org.springframework.security:spring-security-oauth2-authorization-server:${springSecurityOauth2AuthorizationServerVersion}") {
//        transitive(true)
//    }

    // https://mvnrepository.com/artifact/org.jboss.aerogear/aerogear-otp-java
    api ('org.jboss.aerogear:aerogear-otp-java'){
        transitive(false)
    }


// https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-oauth2-resource-server
    api ('org.springframework.boot:spring-boot-starter-oauth2-resource-server') {
        transitive(true)
    }

// https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-oauth2-client
    api ('org.springframework.boot:spring-boot-starter-oauth2-client') {
        transitive(true)
    }

    api ('org.springframework.security:spring-security-remoting'){
        transitive(true)
    }

    implementation project(':events')

}

test {
    useJUnitPlatform()
}
